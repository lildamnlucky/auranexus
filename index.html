<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Nexus Console</title>
  
  <!-- Three.js for 3D Cybernetic Starfield -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #00ff66;
      --accent-secondary: #008833;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --danger: #ff4b4b;
    }

    /* Custom Themes: Green, Orange, Purple, Cyan */
    body.theme-green { --accent: #00ff66; --accent-secondary: #008833; }
    body.theme-orange { --accent: #ff6600; --accent-secondary: #ffcc00; }
    body.theme-purple { --accent: #a855f7; --accent-secondary: #7000ff; }
    body.theme-cyan { --accent: #00f0ff; --accent-secondary: #0077ff; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      touch-action: none;
    }

    /* App Header Layout */
    .app-header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand h1 {
      font-size: 1.1rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .theme-select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 8px;
      border-radius: 8px;
      outline: none;
      font-size: 0.8rem;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover, .btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Main Container Split */
    .main-container {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      overflow: hidden;
      pointer-events: none;
    }

    .chat-section, .sandbox-drawer, .modal {
      pointer-events: auto;
    }

    /* Chat Area */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.9rem;
      animation: fadeIn 0.2s ease;
      white-space: pre-wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #000;
      font-weight: 500;
      border-bottom-right-radius: 2px;
    }

    .message.aura {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-bottom-left-radius: 2px;
    }

    .message img.attached-img {
      max-width: 200px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }

    /* Input & Media Actions Bar */
    .chat-input-wrapper {
      padding: 10px;
      background: rgba(11, 14, 20, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-container {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .plus-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--accent);
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 10px;
      color: white;
      outline: none;
      font-size: 0.9rem;
    }

    /* File Preview Chip */
    .image-preview-bar {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .image-preview-bar img {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 4px;
    }

    /* Sandbox Drawer */
    .sandbox-drawer {
      width: 0%;
      height: 100%;
      background: #11141c;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .sandbox-drawer.open {
      width: 50%;
    }

    @media (max-width: 768px) {
      .sandbox-drawer.open {
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        z-index: 100;
      }
    }

    .sandbox-close-fab {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    iframe#sandbox-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Modal for API Key Settings */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body class="theme-green">

  <!-- Interactive 3D Stars Canvas -->
  <div id="canvas-container"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <h1>AETHER NEXUS</h1>
    </div>

    <div class="nav-actions">
      <select class="theme-select" onchange="changeTheme(this.value)">
        <option value="theme-green">Green</option>
        <option value="theme-orange">Orange</option>
        <option value="theme-purple">Purple</option>
        <option value="theme-cyan">Cyan</option>
      </select>

      <button class="btn" onclick="openKeyModal()">⚙️ Key</button>
      <button class="btn" onclick="toggleVoiceListen()" id="micBtn">🎙️ Speak</button>
      <button class="btn" onclick="toggleSandbox()" id="sandboxToggleBtn">⚡ Sandbox</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="main-container">
    <section class="chat-section">
      <div class="chat-messages" id="chatMessages">
        <div class="message aura">
          Welcome to Aether Nexus! Set your API Key in Settings ⚙️ to connect live AI features, or use the + button to upload image files.
        </div>
      </div>

      <div class="chat-input-wrapper">
        <!-- Image Preview Area -->
        <div class="image-preview-bar" id="imgPreviewBar">
          <img id="imgPreviewThumb" src="" alt="preview" />
          <span id="imgPreviewName">image.png</span>
          <button style="background:none; border:none; color:var(--danger); cursor:pointer;" onclick="removeImage()">✕</button>
        </div>

        <div class="chat-input-container">
          <!-- The PLUS Button for Uploading Images -->
          <label for="imageUploadInput" class="plus-btn" title="Add Image">+</label>
          <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)" />

          <input 
            type="text" 
            id="userInput" 
            class="chat-input" 
            placeholder="Type your prompt..." 
            onkeydown="handleKeyDown(event)"
          />
          <button class="btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </section>

    <!-- Sandbox Drawer -->
    <aside id="sandbox-container" class="sandbox-drawer">
      <button onclick="toggleSandbox()" class="sandbox-close-fab">✕ Close Preview</button>
      <iframe id="sandbox-iframe" src="about:blank"></iframe>
    </aside>
  </main>

  <!-- API Key Modal -->
  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h3>API Settings</h3>
      <p style="font-size: 0.8rem; color: var(--text-dim);">Paste your Gemini or Open API Key below:</p>
      <input type="password" id="apiKeyInput" class="chat-input" placeholder="Paste API Key here..." />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" onclick="closeKeyModal()">Cancel</button>
        <button class="btn" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    /* 1. Theme Selector */
    function changeTheme(themeName) {
      document.body.className = themeName;
      updateStarColor();
    }

    /* 2. Image Selection (+) Handling */
    let selectedImageData = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageData = e.target.result;
          document.getElementById('imgPreviewThumb').src = selectedImageData;
          document.getElementById('imgPreviewName').innerText = file.name;
          document.getElementById('imgPreviewBar').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage() {
      selectedImageData = null;
      document.getElementById('imageUploadInput').value = '';
      document.getElementById('imgPreviewBar').style.display = 'none';
    }

    /* 3. API Key Modal Functions */
    function openKeyModal() {
      document.getElementById('keyModal').style.display = 'flex';
      document.getElementById('apiKeyInput').value = localStorage.getItem('aether_api_key') || '';
    }

    function closeKeyModal() {
      document.getElementById('keyModal').style.display = 'none';
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('aether_api_key', key);
      closeKeyModal();
      alert('API Key saved successfully!');
    }

    /* 4. Chat Engine */
    let messageHistory = [];

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && !selectedImageData) return;

      const chatBox = document.getElementById('chatMessages');

      // Add user message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerText = text;

      if (selectedImageData) {
        const img = document.createElement('img');
        img.src = selectedImageData;
        img.className = 'attached-img';
        userDiv.appendChild(img);
      }

      chatBox.appendChild(userDiv);
      input.value = '';
      
      const auraDiv = document.createElement('div');
      auraDiv.className = 'message aura';
      auraDiv.innerText = "Aether AI processing your input...";
      chatBox.appendChild(auraDiv);

      chatBox.scrollTop = chatBox.scrollHeight;
      removeImage();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter') sendMessage();
    }

    /* 5. Sandbox Drawer */
    function toggleSandbox() {
      const drawer = document.getElementById('sandbox-container');
      drawer.classList.toggle('open');
    }

    /* 6. Speech Recognition */
    function toggleVoiceListen() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported in this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
      };
      recognition.start();
    }

    /* 7. 3D Stars Touch & Drag Engine */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const particlesCount = 500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particlesCount * 3);

    for (let i = 0; i < particlesCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 15;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    let particleMaterial = new THREE.PointsMaterial({
      color: 0x00ff66,
      size: 0.05,
      transparent: true,
      opacity: 0.8
    });

    const particles = new THREE.Points(geometry, particleMaterial);
    scene.add(particles);
    camera.position.z = 5;

    let targetRotationX = 0, targetRotationY = 0, pointerX = 0, pointerY = 0, isDragging = false;

    window.addEventListener('mousedown', (e) => { isDragging = true; pointerX = e.clientX; pointerY = e.clientY; });
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        targetRotationY += (e.clientX - pointerX) * 0.005;
        targetRotationX += (e.clientY - pointerY) * 0.005;
        pointerX = e.clientX; pointerY = e.clientY;
      }
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) { isDragging = true; pointerX = e.touches[0].clientX; pointerY = e.touches[0].clientY; }
    });
    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        targetRotationY += (e.touches[0].clientX - pointerX) * 0.005;
        targetRotationX += (e.touches[0].clientY - pointerY) * 0.005;
        pointerX = e.touches[0].clientX; pointerY = e.touches[0].clientY;
      }
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    function updateStarColor() {
      const hexColor = getComputedStyle(document.body).getPropertyValue('--accent').trim();
      if (particleMaterial && hexColor) particleMaterial.color.set(hexColor);
    }

    function animateThree() {
      requestAnimationFrame(animateThree);
      particles.rotation.y += (targetRotationY - particles.rotation.y) * 0.1;
      particles.rotation.x += (targetRotationX - particles.rotation.x) * 0.1;
      particles.rotation.z += 0.0008;
      renderer.render(scene, camera);
    }
    animateThree();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
